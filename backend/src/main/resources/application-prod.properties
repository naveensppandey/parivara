# Production Profile — PostgreSQL Cloud Database Configuration
server.port=${PORT:8080}

# PostgreSQL Database Connection (Read strictly from environment variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Admin Security & Business Config via Environment Variables
parivara.admin.email=${ADMIN_EMAIL}
parivara.admin.password=${ADMIN_PASSWORD}
parivara.whatsapp.number=${WHATSAPP_NUMBER:919305762044}
parivara.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
